<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--gold1:#C9A84C;--gold2:#B8922E;--gold3:#A07B1E;--gold-light:#E8D08A;
--dark:#1E1A12;--dark2:#2A2418;--ow4:#E0DDD3;--text3:#A09878;--white:#FFFFFF;
}
html,body{min-height:100%}
body{font-family:'Nunito Sans',sans-serif;background:var(--dark);color:var(--ow4);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 24px;
background-image:radial-gradient(circle at 50% 0%,rgba(201,168,76,0.12),transparent 60%)}

.card{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;text-align:center}

.foto-wrap{position:relative;width:120px;height:120px;margin-bottom:24px}
.foto-wrap img{width:120px;height:120px;border-radius:50%;object-fit:cover;object-position:center top;border:2px solid var(--gold1);display:block}
.foto-placeholder{width:120px;height:120px;border-radius:50%;background:var(--dark2);border:2px solid var(--gold1);display:flex;align-items:center;justify-content:center;font-family:'Lora',serif;font-size:11px;color:var(--text3);font-style:italic;padding:16px}
.foto-wrap::after{content:'';position:absolute;inset:-5px;border-radius:50%;border:1px solid var(--gold1);opacity:0.4}

.nome{font-family:'Nunito Sans',sans-serif;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--gold-light);font-weight:600;margin-bottom:28px}

.eyebrow{font-family:'Nunito Sans',sans-serif;font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--gold1);font-weight:600;margin-bottom:12px}
.titulo{font-family:'Playfair Display',serif;font-size:clamp(40px,12vw,56px);font-weight:500;line-height:1.05;color:var(--white);margin-bottom:6px}
.titulo em{font-style:italic;color:var(--gold-light)}
.divider{width:40px;height:1px;background:var(--gold1);margin:24px 0}
.texto{font-family:'Lora',serif;font-size:16px;line-height:1.8;color:var(--ow4);max-width:340px;margin-bottom:32px}

.btn-grupo{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;background:var(--gold2);color:var(--white);padding:19px 24px;font-family:'Nunito Sans',sans-serif;font-size:12px;letter-spacing:3px;text-transform:uppercase;font-weight:600;text-decoration:none;transition:background 0.3s}
.btn-grupo:hover{background:var(--gold3)}
.btn-grupo svg{width:20px;height:20px;fill:white;flex-shrink:0}

.aviso{font-family:'Lora',serif;font-size:12px;color:var(--text3);font-style:italic;margin-top:16px;line-height:1.6}

.links{margin-top:40px;display:flex;flex-direction:column;align-items:center;gap:10px}
.link-site{font-family:'Nunito Sans',sans-serif;font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold1);text-decoration:none;font-weight:600;border-bottom:1px solid rgba(201,168,76,0.4);padding-bottom:3px}
.link-site:hover{color:var(--gold-light)}
.link-priv{font-family:'Lora',serif;font-size:11px;color:var(--text3);text-decoration:none}
.link-priv:hover{color:var(--gold-light)}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.foto-wrap{animation:fadeUp .5s ease both}
.nome{animation:fadeUp .5s .1s ease both}
.eyebrow{animation:fadeUp .5s .15s ease both}
.titulo{animation:fadeUp .5s .2s ease both}
.divider{animation:fadeUp .5s .25s ease both}
.texto{animation:fadeUp .5s .3s ease both}
.btn-grupo{animation:fadeUp .5s .35s ease both}
.aviso,.links{animation:fadeUp .5s .4s ease both}
</style>
</head>
